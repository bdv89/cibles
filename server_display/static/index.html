<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventaire Cibles</title>
    <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=37" />
    <link rel="stylesheet" href="cibles.css?v=12" />
    <script src="theme.js?v=2"></script>
  </head>
  <!-- app-screen : mise en page pleine hauteur, tout tient dans un ecran, seul le tableau
       defile. Classe portee par cette page uniquement — categories.html et metrics.html
       partagent styles.css et doivent garder un defilement normal. -->
  <body class="app-screen">
    <header class="site-header">
      <a href="./" class="logo-link">
        <span class="site-logo-text">Inventaire cibles</span>
      </a>
      <!-- ① Navigation APPLICATIVE (on change de page). A ne pas confondre avec la
           pagination (bande ⑤), qui navigue dans les donnees d'une meme page. -->
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="./" class="active" aria-current="page">Inventaire</a>
        <a href="categories.html">Catégories</a>
        <a href="documents.html">Documents</a>
        <a href="metrics.html">Métriques</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Basculer clair/sombre">🌙</button>
    </header>

    <main class="shell">
      <!-- SEPARATION DES RESPONSABILITES — une bande = une responsabilite, position stable :
           ① identite + navigation applicative (site-header)  ② agir sur les donnees
           ③ configurer l'affichage  ④ donnees + tri  ⑤ se situer + naviguer dans les donnees
           Les ecarts intra-groupe (8px) sont volontairement plus serres que les ecarts
           inter-groupes (24px) : sans cette difference, aucun regroupement n'est perceptible. -->

      <!-- ② AGIR sur les donnees : chercher (frequent, a gauche) puis agir (rare, a droite). -->
      <section class="controls">
        <label for="search" class="search-label">Rechercher</label>
        <input
          id="search"
          type="search"
          placeholder="matériau, référence, forme, emplacement…  ( / pour y accéder)"
          autocomplete="off"
        />
        <div class="meta" id="meta"></div>
        <div class="controls-actions">
          <button id="add-entry-btn" class="btn-add hidden" title="Ajouter une entree">+</button>
          <button id="export-btn" class="btn-export" title="Exporter les noms pour LLM">Exporter</button>
        </div>
      </section>

      <!-- ③ CONFIGURER l'affichage : le libelle nomme la zone, sinon 14 pastilles flottent
           sans dire de quoi elles parlent. -->
      <div class="columns-bar">
        <span class="columns-label" id="columns-label">Colonnes</span>
        <div class="toggle-row" id="toggle-row" role="group" aria-labelledby="columns-label">
          <!-- Un bouton bascule par colonne, généré par app.js -->
        </div>
      </div>

      <!-- ④ DONNEES : le tri vit dans les en-tetes, au plus pres de ce qu'il trie. -->
      <section class="table-wrap" id="main-table-wrap">
        <table id="table">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>

      <!-- ⑤ SE SITUER + NAVIGUER dans les donnees. Sous le tableau : c'est la que l'oeil
           cherche une pagination, et elle reste visible puisque la page ne defile pas. -->
      <div class="statusbar">
        <div class="stats-row">
          <span class="stats" id="stats">0 cible</span>
          <span class="stats" id="stats-neuve">Neuves 0</span>
          <span class="stats" id="stats-finie">Finies 0</span>
        </div>
        <nav class="pager" aria-label="Pagination des résultats">
          <button type="button" class="pager-btn pager-prev">◀ Précédent</button>
          <span class="pager-info"></span>
          <button type="button" class="pager-btn pager-next">Suivant ▶</button>
          <label class="pager-size">
            <span>par page</span>
            <select class="pager-size-select">
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
            </select>
          </label>
        </nav>
      </div>
    </main>

    <!-- Pied de page retire ici (70px purement decoratifs). Conserve sur les autres pages. -->

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="edit-modal-title">Modifier l'entree</h2>
        <form id="edit-form">
          <!-- Fields generated by edit.js -->
        </form>
        <div id="edit-status" class="edit-status hidden"></div>
        <div class="modal-actions">
          <button type="button" class="btn-save" onclick="EditModal.save()">Enregistrer</button>
          <button type="button" class="btn-cancel" onclick="EditModal.close()">Annuler</button>
          <button type="button" class="btn-delete" onclick="EditModal.delete()">Supprimer</button>
        </div>
      </div>
    </div>

    <script src="app.js?v=32"></script>
    <script src="edit.js?v=8"></script>
    <script src="coa.js?v=3"></script>
  </body>
</html>
